version: 0.2

env:
  variables:
    NODE_VERSION: "22"
    PNPM_VERSION: "9.15.0"
    SST_STAGE: "production"
    INFRA_PATH: "packages/infra"
    INFRA_CREATE_PIPELINES: "false"
    INFRA_PROFILE: "expo-web"
    INFRA_APP_NAME: "bitacora"
    INFRA_ROOT_DOMAIN: "bitacora.hashpass.tech"
    INFRA_HOSTED_ZONE_DOMAIN: "hashpass.tech"
    INFRA_PIPELINE_REPO: "hashpass-tech/BITACORA"
    INFRA_PIPELINE_PREFIX: "bitacora"
    INFRA_PROJECT_TAG: "bitacora"
    INFRA_PIPELINE_BRANCH_PROD: "main"
    INFRA_PIPELINES: "production"
    INFRA_PIPELINE_PERMISSIONS_MODE: "admin"
    INFRA_ENABLE_CUSTOM_DOMAIN: "true"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - corepack enable pnpm
      - corepack prepare pnpm@${PNPM_VERSION} --activate
      - pnpm --version
      - pnpm install --frozen-lockfile

  pre_build:
    commands:
      - echo "Branch = ${CODEBUILD_WEBHOOK_HEAD_REF:-${CODEBUILD_SOURCE_VERSION:-unknown}}"
      - echo "Stage  = ${SST_STAGE}"
      - pnpm --filter @bitacora/shared build
      - pnpm --filter @bitacora/infra run doctor

  build:
    commands:
      - pnpm --filter @bitacora/infra run deploy:prod

  post_build:
    commands:
      - echo "Production deploy completed."
